# Left half only (split central).
#
# These three settings govern the BLE link between the two halves. They are set
# by the central, so this file is the only place they take effect.
#
# ZMK's defaults are tuned for battery life on a keyboard running off coin cells:
#   PREF_INT     = 6    ->  7.5ms connection interval
#   PREF_LATENCY = 30   ->  the right half may skip up to 30 consecutive
#                           connection events, so it is only obliged to listen
#                           every ~225ms
#   PREF_TIMEOUT = 400  ->  4 seconds before a dead link is declared dead
#
# Both halves here run on USB power with no cells fitted, so latency 0 makes the
# right half listen on every interval. A 4-second supervision timeout gives a
# brief radio interruption a chance to recover without disconnecting and
# re-advertising, at the cost of detecting a truly dead half more slowly.
CONFIG_ZMK_SPLIT_BLE_PREF_LATENCY=0
CONFIG_ZMK_SPLIT_BLE_PREF_TIMEOUT=400

# Use a 15ms split interval instead of 7.5ms. This halves the number of split
# connection events and may reduce radio contention on the central. It does not
# guarantee alignment with the host connection interval.
CONFIG_ZMK_SPLIT_BLE_PREF_INT=12
