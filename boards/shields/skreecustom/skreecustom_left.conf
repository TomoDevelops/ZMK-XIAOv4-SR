# Left half only (split central).
#
# These three settings govern the BLE link between the two halves. They are set
# by the central, so this file is the only place they take effect.
#
# ZMK's defaults are tuned for battery life on a keyboard running off coin cells:
#   PREF_INT     = 6    ->  7.5ms connection interval
#   PREF_LATENCY = 30   ->  the right half may skip up to 30 consecutive
#                           connection events, so it is only obliged to listen
#                           every ~225ms
#   PREF_TIMEOUT = 400  ->  4 seconds before a dead link is declared dead
#
# Both halves here run on USB power with no cells fitted, so that trade is all
# cost and no benefit. Latency 0 makes the right half listen on every interval,
# which removes the anchor-point re-acquisition that shows up as "lags, then
# spams the key you were holding". Timeout 100 (1s) means a link that really
# does drop recovers in a second instead of four.
CONFIG_ZMK_SPLIT_BLE_PREF_LATENCY=0
CONFIG_ZMK_SPLIT_BLE_PREF_TIMEOUT=100

# If the above is not enough on its own, uncomment this next. It moves the split
# link from 7.5ms to 15ms, which lines up with the connection interval macOS
# uses for its own link to the keyboard and reduces radio collisions on the
# central. Change one thing at a time.
# CONFIG_ZMK_SPLIT_BLE_PREF_INT=12
