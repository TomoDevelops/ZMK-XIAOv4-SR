# Keep firmware logging deferred and low-volume. The custom diagnostic module
# emits only boot/reset, BLE-link, five-second heartbeat, and security events.
CONFIG_SKREE_DIAGNOSTICS=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_MODE_OVERFLOW=y
CONFIG_LOG_BLOCK_IN_THREAD=n
CONFIG_LOG_DEFAULT_LEVEL=1
CONFIG_LOG_MAX_LEVEL=3
CONFIG_LOG_BUFFER_SIZE=2048
CONFIG_LOG_PROCESS_THREAD_SLEEP_MS=250
CONFIG_LOG_PRINTK=n
CONFIG_LOG_BACKEND_SHOW_COLOR=n
CONFIG_USB_CDC_ACM_RINGBUF_SIZE=512

# Preserve errors from ZMK's shared module and the 74HC595 GPIO driver without
# enabling their high-volume info/debug messages.
CONFIG_ZMK_LOG_LEVEL_ERR=y
CONFIG_GPIO_LOG_LEVEL_ERR=y
