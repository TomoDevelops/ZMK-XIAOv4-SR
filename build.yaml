# This file generates the GitHub Actions matrix.
# For simple board + shield combinations, add them to the top level board and
# shield arrays, for more control, add individual board + shield combinations
# to the `include` property. You can also use the `cmake-args` property to
# pass flags to the build command and `artifact-name` to assign a name to
# distinguish build outputs from each other:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#   - board: nice_nano_v2
#     shield: corne_left
#     snippet: zmk-usb-logging
#     artifact-name: corne_left_with_logging
#
---
include:
#   - board: nice_nano
#     shield: lily58_left
#   - board: nice_nano
#     shield: lily58_right
  - board: seeeduino_xiao_ble
    shield: skreecustom_left
  - board: seeeduino_xiao_ble
    shield: skreecustom_right

  # Lightweight diagnostic builds. The auxiliary shield limits output to reset
  # causes, BLE link transitions, five-second health summaries, and errors.
  # Flash these only while continuously capturing both serial ports, then go
  # back to the normal firmware.
  - board: seeeduino_xiao_ble
    shield: "skreecustom_left skreecustom_diagnostics"
    snippet: zmk-usb-logging
    artifact-name: skreecustom_left_light_logging
  - board: seeeduino_xiao_ble
    shield: "skreecustom_right skreecustom_diagnostics"
    snippet: zmk-usb-logging
    artifact-name: skreecustom_right_light_logging

  # Wipes stored BLE bonds. Flash to a half, let it sit ~10s, then flash the
  # normal firmware back. Do both halves together, never just one.
  - board: seeeduino_xiao_ble
    shield: settings_reset
