# This file generates the GitHub Actions matrix.
# For simple board + shield combinations, add them to the top level board and
# shield arrays, for more control, add individual board + shield combinations
# to the `include` property. You can also use the `cmake-args` property to
# pass flags to the build command and `artifact-name` to assign a name to
# distinguish build outputs from each other:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#   - board: nice_nano_v2
#     shield: corne_left
#     snippet: zmk-usb-logging
#     artifact-name: corne_left_with_logging
#
---
include:
#   - board: nice_nano
#     shield: lily58_left
#   - board: nice_nano
#     shield: lily58_right
  - board: seeeduino_xiao_ble
    shield: skreecustom_left
  - board: seeeduino_xiao_ble
    shield: skreecustom_right

  # Diagnostic builds. Identical to the firmware above but with a USB serial
  # console that logs BLE events. Flash one of these only while capturing a log,
  # then go back to the normal firmware.
  - board: seeeduino_xiao_ble
    shield: skreecustom_left
    snippet: zmk-usb-logging
    artifact-name: skreecustom_left_logging
  - board: seeeduino_xiao_ble
    shield: skreecustom_right
    snippet: zmk-usb-logging
    artifact-name: skreecustom_right_logging

  # Wipes stored BLE bonds. Flash to a half, let it sit ~10s, then flash the
  # normal firmware back. Do both halves together, never just one.
  - board: seeeduino_xiao_ble
    shield: settings_reset
