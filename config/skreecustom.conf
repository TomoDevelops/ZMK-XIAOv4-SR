# Shared settings for both halves. ZMK loads this from the user config directory;
# boards/shields/skreecustom/skreecustom.conf is not loaded for the suffixed
# skreecustom_left / skreecustom_right shields.
CONFIG_ZMK_SLEEP=n
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=10
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=15

# The columns hang off a 74HC595 over SPI, which cannot be written from the
# interrupt path. kscan_matrix_interrupt_disable() fails with -EAGAIN on every
# wake from idle -- observed 16 times in 47s of typing. It returns on the first
# failure, so outputs 1..5 are left energised too, and a key pressed in that
# window can register on the wrong column.
#
# MATRIX_POLLING avoids that path. Keep the 2MHz SPI clock in skreecustom.dtsi.
# Earlier builds labeled as polling did not load this shared configuration;
# verify CONFIG_ZMK_KSCAN_MATRIX_POLLING=y in the generated .config.
CONFIG_ZMK_KSCAN_MATRIX_POLLING=y

# Do not set CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC here. Neither ZMK's XIAO BLE
# board files nor upstream Zephyr's override the 32kHz clock source, so the
# default applies: the external crystal at 50ppm. Forcing the internal RC
# oscillator also forces the advertised sleep clock accuracy to 500ppm
# (zephyr/drivers/clock_control/Kconfig.nrf) and makes it drift with
# temperature, which widens BLE receive windows on both halves.

CONFIG_ZMK_RGB_UNDERGLOW=n
